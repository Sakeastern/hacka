<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flowfield</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const stars = [];
for (let i = 0; i < 220; i++) {
  stars.push({
    x: Math.random() * w,
    y: Math.random() * h,
    z: Math.random() * 1.5 + 0.3,
    tw: Math.random() * Math.PI * 2
  });
}

function frame(t) {
  ctx.fillStyle = 'rgba(5, 6, 10, 1)';
  ctx.fillRect(0, 0, w, h);
  for (const s of stars) {
    const a = 0.4 + 0.6 * Math.abs(Math.sin(s.tw + t * 0.001));
    ctx.fillStyle = 'rgba(180, 200, 255, ' + a.toFixed(2) + ')';
    ctx.fillRect(s.x, s.y, s.z, s.z);
    s.x += s.z * 0.15;
    if (s.x > w) s.x = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
