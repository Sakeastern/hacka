<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flowfield</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const N = 700;
const parts = [];
for (let i = 0; i < N; i++) {
  parts.push({ x: Math.random() * w, y: Math.random() * h, vx: 0, vy: 0 });
}

function flowAngle(x, y, t) {
  const s = 0.0016;
  return (Math.sin(x * s + t) + Math.cos(y * s + t * 0.7) + Math.sin((x + y) * s * 0.6)) * Math.PI;
}

function frame(t) {
  ctx.fillStyle = 'rgba(5, 6, 10, 0.08)';
  ctx.fillRect(0, 0, w, h);
  const tt = t * 0.0004;
  for (const p of parts) {
    const a = flowAngle(p.x, p.y, tt);
    p.vx = Math.cos(a) * 1.6;
    p.vy = Math.sin(a) * 1.6;
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = w; else if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h; else if (p.y > h) p.y = 0;
    ctx.fillStyle = 'rgba(150, 180, 255, 0.5)';
    ctx.fillRect(p.x, p.y, 1.4, 1.4);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
