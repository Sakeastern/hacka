<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flowfield</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060a; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e6edf3;
  }
  canvas { display: block; position: fixed; inset: 0; }

  .panel {
    position: fixed; top: 18px; left: 18px; z-index: 5;
    background: rgba(13, 17, 23, 0.55);
    border: 1px solid rgba(88, 166, 255, 0.18);
    backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 16px 18px;
    max-width: 260px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .panel h1 {
    margin: 0 0 2px; font-size: 18px; font-weight: 600; letter-spacing: 0.3px;
    background: linear-gradient(90deg, #58a6ff, #7ee787, #bc8cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel .sub { font-size: 11px; color: #8b949e; margin-bottom: 12px; }
  .stats { display: flex; gap: 14px; font-size: 11px; color: #8b949e; margin-bottom: 12px; }
  .stats b { color: #c9d1d9; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .btn {
    background: rgba(88, 166, 255, 0.1);
    border: 1px solid rgba(88, 166, 255, 0.25);
    color: #c9d1d9; font-size: 11px; padding: 5px 9px; border-radius: 8px;
    cursor: pointer; transition: all 0.15s ease; user-select: none;
  }
  .btn:hover { background: rgba(88, 166, 255, 0.22); color: #fff; }
  .btn.on { background: rgba(126, 231, 135, 0.18); border-color: rgba(126, 231, 135, 0.4); color: #7ee787; }
  .label { font-size: 10px; color: #6e7681; text-transform: uppercase; letter-spacing: 0.6px; margin: 8px 0 4px; }
  .hint { font-size: 11px; color: #6e7681; line-height: 1.5; margin-top: 10px; }
  .hint kbd {
    background: rgba(110,118,129,0.2); border: 1px solid rgba(110,118,129,0.3);
    border-radius: 4px; padding: 0 4px; font-size: 10px; color: #c9d1d9;
  }
  @media (max-width: 520px) {
    .panel { max-width: calc(100vw - 36px); top: 12px; left: 12px; padding: 12px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>flowfield</h1>
  <div class="sub">cosmic particle flow</div>
  <div class="stats">
    <span>partikel <b id="stN">0</b></span>
    <span>fps <b id="stF">0</b></span>
  </div>
  <div class="label">mode warna</div>
  <div class="row" id="modes">
    <div class="btn on" data-mode="aurora">aurora</div>
    <div class="btn" data-mode="ember">ember</div>
    <div class="btn" data-mode="ocean">ocean</div>
    <div class="btn" data-mode="mono">mono</div>
  </div>
  <div class="row">
    <div class="btn on" id="glowBtn">glow</div>
    <div class="btn" id="resetBtn">reset</div>
  </div>
  <div class="hint">gerakin <kbd>mouse</kbd> buat arahin alur partikel, <kbd>klik tahan</kbd> buat tolak.</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, w, h);
}
resize();
window.addEventListener('resize', resize);

const N = 900;
let parts = [];
function spawn() {
  parts = [];
  for (let i = 0; i < N; i++) {
    parts.push({ x: Math.random() * w, y: Math.random() * h, vx: 0, vy: 0, life: Math.random() * 240 });
  }
}
spawn();

const mouse = { x: -9999, y: -9999, down: false };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
window.addEventListener('mousedown', () => { mouse.down = true; });
window.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('touchmove', e => {
  const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true;
}, { passive: true });
canvas.addEventListener('touchend', () => { mouse.down = false; mouse.x = -9999; mouse.y = -9999; });

let mode = 'aurora';
let glow = true;
document.querySelectorAll('#modes .btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#modes .btn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.mode;
  });
});
document.getElementById('glowBtn').addEventListener('click', e => {
  glow = !glow;
  e.currentTarget.classList.toggle('on', glow);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, w, h);
  spawn();
});

function flowAngle(x, y, t) {
  const s = 0.0016;
  return (Math.sin(x * s + t) + Math.cos(y * s + t * 0.7) + Math.sin((x + y) * s * 0.6)) * Math.PI;
}

const palettes = {
  aurora: (hue) => [hue, 90, 60],
  ember:  (hue) => [(hue * 0.4 + 10) % 60, 95, 58],
  ocean:  (hue) => [180 + (hue % 60), 85, 58],
  mono:   ()    => [210, 12, 78]
};

const stN = document.getElementById('stN');
const stF = document.getElementById('stF');
let fps = 0, frames = 0, lastFps = performance.now();

function frame(t) {
  ctx.fillStyle = 'rgba(5, 6, 10, 0.06)';
  ctx.fillRect(0, 0, w, h);
  const tt = t * 0.0004;
  const hueBase = (t * 0.02) % 360;
  const R = 190;
  if (glow) ctx.shadowBlur = 8; else ctx.shadowBlur = 0;
  const pal = palettes[mode];
  for (const p of parts) {
    let a = flowAngle(p.x, p.y, tt);
    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < R * R) {
      const d = Math.sqrt(d2) || 1;
      const force = (1 - d / R);
      const swirl = mouse.down ? -1 : 1;
      a += Math.atan2(dy, dx) * swirl * force * 1.6;
      const pull = (mouse.down ? -1 : 0.5) * force;
      p.vx += (dx / d) * pull;
      p.vy += (dy / d) * pull;
    }
    p.vx = p.vx * 0.9 + Math.cos(a) * 1.7;
    p.vy = p.vy * 0.9 + Math.sin(a) * 1.7;
    p.x += p.vx; p.y += p.vy; p.life++;
    if (p.x < 0) p.x = w; else if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h; else if (p.y > h) p.y = 0;
    if (p.life > 260) { p.x = Math.random() * w; p.y = Math.random() * h; p.life = 0; }
    const c = pal((hueBase + (p.x + p.y) * 0.05) % 360);
    ctx.fillStyle = 'hsla(' + c[0].toFixed(0) + ',' + c[1] + '%,' + c[2] + '%,0.72)';
    if (glow) ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(p.x, p.y, 1.7, 1.7);
  }
  ctx.shadowBlur = 0;
  frames++;
  if (t - lastFps > 500) {
    fps = Math.round(frames * 1000 / (t - lastFps));
    frames = 0; lastFps = t;
    stF.textContent = fps; stN.textContent = N;
  }
  requestAnimationFrame(frame);
}
stN.textContent = N;
requestAnimationFrame(frame);
</script>
</body>
</html>
